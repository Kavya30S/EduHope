{% extends "base.html" %}
{% block title %}Your Pet{% endblock %}
{% block content %}
<h2>Your Pet: <span id="pet-name">{{ pet.name }}</span></h2>
<div class="pet-container">
    <div id="pet-image" class="animate-on-load" style="font-size: 100px;">🐉</div>
    <p class="pet-stats">Happiness: <span id="happiness">{{ pet.happiness }}</span></p>
    <p class="pet-stats">Hunger: <span id="hunger">{{ pet.hunger }}</span></p>
    <p class="pet-stats">Energy: <span id="energy">{{ pet.energy }}</span></p>
    <p>Mood: <span id="mood">{{ pet.mood.mood }}</span></p>
    <button id="feed-btn" data-action="feed-pet">Feed</button>
    <button id="play-btn">Play</button>
</div>
<script src="{{ url_for('static', filename='js/pet.js') }}"></script>
{% endblock %}
