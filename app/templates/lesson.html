{% extends "base.html" %}
{% block title %}Lessons{% endblock %}
{% block content %}
<h2>{{ lesson.title if lesson else "Your Lessons" }}</h2>
{% if lesson %}
    <p>{{ lesson.content }}</p>
    <form method="POST">
        <input type="number" name="score" min="0" max="100" placeholder="Your Score">
        <button type="submit">Submit</button>
    </form>
{% else %}
    <ul>
        {% for l in lessons %}
            <li><a href="{{ url_for('education.lesson', lesson_id=l.id) }}">{{ l.title }} - {{ l.subject }}</a></li>
        {% endfor %}
    </ul>
{% endif %}
{% endblock %}
