{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block content %}
<h2>Chat with Your Buddy</h2>
<div id="chat-container" style="height: 400px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; border-radius: 10px;">
    {% for message in messages %}
        <p><strong>{{ "You" if message.is_from_user else "Buddy" }}:</strong> {{ message.content }}</p>
    {% endfor %}
</div>
<form method="POST" action="/chat/send">
    <textarea name="message" rows="3" style="width: 100%; border-radius: 5px;"></textarea>
    <button type="submit">Send</button>
</form>
<script>
    document.getElementById("chat-container").scrollTop = document.getElementById("chat-container").scrollHeight;
</script>
{% endblock %}
