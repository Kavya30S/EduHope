<!-- Using dataset: custom_stories.txt -->

{% extends 'base.html' %}
{% block content %}
<div class="storytelling">
    <h1>Collaborative Storytelling</h1>
    <p>Start with this prompt: {{ random_prompt }}</p>
    <form method="POST" action="{{ url_for('storytelling.new_story') }}">
        <input type="text" name="title" placeholder="Story Title" required>
        <textarea name="prompt" placeholder="Start your story..." required></textarea>
        <button type="submit" class="btn">Create</button>
    </form>
    <div id="story-list">
        {% for story in stories %}
            <h3>{{ story.title }}</h3>
            <p>{{ story.content }}</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
