{% extends "base.html" %}
{% block title %}Storytelling{% endblock %}
{% block content %}
<h2>Your Stories</h2>
<ul>
    {% for story in stories %}
        <li>{{ story.title }} - {{ story.genre }}</li>
    {% endfor %}
</ul>
{% if generated_story %}
    <h3>Generated Story</h3>
    <p>{{ generated_story }}</p>
{% endif %}
<form method="POST" action="{{ url_for('storytelling.create_story') }}">
    <input type="text" name="title" placeholder="Story Title" required>
    <textarea name="content" rows="5" placeholder="Write your story..." required></textarea>
    <button type="submit">Save Story</button>
</form>
<form method="POST" action="{{ url_for('storytelling.generate_story') }}">
    <input type="text" name="theme" placeholder="Story Theme (e.g., adventure)">
    <button type="submit">Generate Story</button>
</form>
{% endblock %}
